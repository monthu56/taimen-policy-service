[project]
name = "taimen-policy-service"
version = "0.1.0"
description = "Product-neutral Policy Decision Point: ReBAC authorization over OpenFGA"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.28",
    "platform-auth-sdk",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
policy-service = "policy_service.app:main"
policy-worker = "policy_service.worker:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "pyjwt[crypto]>=2.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_service"]

[tool.uv]
package = true

[tool.uv.sources]
# Общий enforcement SDK — соседний репозиторий суперпроекта (ADR-0029/0030):
# контекст docker build поэтому — корень суперпроекта, не каталог сервиса.
platform-auth-sdk = { path = "../platform-auth-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["fga: тесты, которым нужен живой OpenFGA (POL_TEST_FGA_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# B008: FastAPI Depends в значениях по умолчанию.
# RUF001-003: пояснения пишутся по-русски, кириллица в них не является ошибкой.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
